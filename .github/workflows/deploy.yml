name: Deploy TeamNoFat site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Add missing photos
        run: |
          mkdir -p assets/img
          B="https://d8j0ntlcm91z4.cloudfront.net/user_3Jh0CPxpJbhz8EelwpM3LsbJtTr/hf_20261115_"
          get() {
            if [ ! -f "assets/img/$1.jpg" ]; then
              curl -fsSL -o "/tmp/$1.png" "$B$2.png"
              ffmpeg -loglevel error -y -i "/tmp/$1.png" -vf "scale='min(1400,iw)':-2" -q:v 3 "assets/img/$1.jpg"
            fi
          }
          get curl 132941_8071bc0f-c3e2-4338-af79-a2aa93f2285e
          get bench 132941_794763fa-0c7a-4207-9517-5aa5f9d57c57
          get squat 132940_73f00d44-37d8-44e6-8862-f3ab9d6fd746
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Add photos"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
