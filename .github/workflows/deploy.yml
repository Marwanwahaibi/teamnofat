name: Deploy TeamNoFat site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Import website files (first run only)
        run: |
          if [ ! -f index.html ]; then
            curl -fsSL -o site.zip "https://d2ol7oe51mr4n9.cloudfront.net/user_3Jh0CPxpJbhz8EelwpM3LsbJtTr/2885a9a1-0dd0-40a9-b05c-dec1f6867e3e.zip"
            unzip -o site.zip -d .
            rm site.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Import TeamNoFat website"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
